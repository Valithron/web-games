<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">Greenhold Quiet Ledger</title>
  <desc id="desc">A wax-sealed ledger rests on warm parchment beside a dark green baronial seal and a small road-side wayhouse.</desc>
  <defs>
    <linearGradient id="paper" x2="0" y2="1">
      <stop stop-color="#f4dfb0"/>
      <stop offset="1" stop-color="#d9b979"/>
    </linearGradient>
    <linearGradient id="cover" x2="0.9" y2="1">
      <stop stop-color="#173d32"/>
      <stop offset="1" stop-color="#09251f"/>
    </linearGradient>
    <linearGradient id="page" x2="0" y2="1">
      <stop stop-color="#fff0c9"/>
      <stop offset="1" stop-color="#e7c985"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="14" stdDeviation="13" flood-color="#2b1b12" flood-opacity=".28"/>
    </filter>
    <pattern id="grain" width="42" height="42" patternUnits="userSpaceOnUse">
      <path d="M4 9l7-2m15 17l5-1M18 35l8-2M34 8l3 1" stroke="#8f6936" stroke-opacity=".12" stroke-width="2" stroke-linecap="round"/>
    </pattern>
  </defs>

  <rect width="800" height="600" fill="url(#paper)"/>
  <rect width="800" height="600" fill="url(#grain)"/>
  <path d="M25 25h750v550H25z" fill="none" stroke="#76532b" stroke-opacity=".55" stroke-width="5"/>
  <path d="M42 42h716v516H42z" fill="none" stroke="#c59649" stroke-opacity=".7" stroke-width="2"/>

  <!-- A quiet road leading toward the wayhouse. -->
  <path d="M118 520C210 470 275 435 355 375c56-42 104-74 168-96 42-14 79-17 132-16" fill="none" stroke="#765833" stroke-opacity=".35" stroke-width="42" stroke-linecap="round"/>
  <path d="M118 520C210 470 275 435 355 375c56-42 104-74 168-96 42-14 79-17 132-16" fill="none" stroke="#ead49e" stroke-width="28" stroke-linecap="round"/>
  <path d="M118 520C210 470 275 435 355 375c56-42 104-74 168-96 42-14 79-17 132-16" fill="none" stroke="#c19a57" stroke-opacity=".6" stroke-width="3" stroke-dasharray="8 13" stroke-linecap="round"/>

  <!-- Baronial seal. -->
  <g transform="translate(180 190)" filter="url(#shadow)">
    <circle r="112" fill="#12382e" stroke="#0a211c" stroke-width="9"/>
    <circle r="91" fill="none" stroke="#c8a45d" stroke-width="4" stroke-dasharray="3 10"/>
    <circle r="76" fill="#1d4b3b" stroke="#d6b86d" stroke-opacity=".7" stroke-width="3"/>
    <path d="M-42-42l18-29 24 18 24-18 18 29v18h-84z" fill="#d8b96c" stroke="#102c25" stroke-width="6" stroke-linejoin="round"/>
    <path d="M-48-8L0-38 48-8l-9 58c-18 25-62 25-80 0z" fill="#ead08a" stroke="#102c25" stroke-width="7" stroke-linejoin="round"/>
    <path d="M0-18v68M-31 5h62M-18-22l18 20 18-20" fill="none" stroke="#1c493a" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M-62 66q62 35 124 0" fill="none" stroke="#d6b86d" stroke-width="5" stroke-linecap="round"/>
  </g>

  <!-- Wayhouse marker in the distance. -->
  <g transform="translate(630 190)">
    <circle r="58" fill="#ead39a" stroke="#98723a" stroke-width="4"/>
    <path d="M-35-5L0-36 35-5v42h-70z" fill="#234b3d" stroke="#123127" stroke-width="5" stroke-linejoin="round"/>
    <path d="M-43-5L0-44 43-5" fill="none" stroke="#c69f59" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M-10 37V9h20v28M-25 5h14v13h-14zM11 5h14v13H11z" fill="#e5c477" stroke="#123127" stroke-width="4"/>
    <path d="M-18-25h36" stroke="#e5c477" stroke-width="5" stroke-linecap="round"/>
  </g>

  <!-- Open ledger. -->
  <g transform="translate(408 398) rotate(-5)" filter="url(#shadow)">
    <path d="M-188-128Q-84-145 0-120v272q-90-25-188 0z" fill="url(#cover)" stroke="#081d18" stroke-width="8" stroke-linejoin="round"/>
    <path d="M188-128Q84-145 0-120v272q90-25 188 0z" fill="url(#cover)" stroke="#081d18" stroke-width="8" stroke-linejoin="round"/>
    <path d="M-166-105Q-80-119-10-99v226q-74-19-156 0z" fill="url(#page)" stroke="#bd9149" stroke-width="4"/>
    <path d="M166-105Q80-119 10-99v226q74-19 156 0z" fill="url(#page)" stroke="#bd9149" stroke-width="4"/>
    <path d="M0-112v267" stroke="#071b16" stroke-width="14"/>
    <path d="M-139-73h91m-91 32h102m-102 32h73m-73 76h94m-94 32h78M47-73h91m-102 32h102m-73 32h73m-94 76h94m-78 32h78" stroke="#8e6a39" stroke-opacity=".52" stroke-width="5" stroke-linecap="round"/>
    <path d="M-126 22q34-24 67 0t67 0M42 22q34-24 67 0t67 0" fill="none" stroke="#b58a48" stroke-opacity=".8" stroke-width="4"/>
    <path d="M-137-91h92M45-91h92" stroke="#dab766" stroke-width="4" stroke-linecap="round"/>
    <!-- wax seal -->
    <g transform="translate(74 84)">
      <path d="M-33-18q-7 32 13 41 27 15 47-7 19-21 1-43-20-24-46-7z" fill="#7e332e" stroke="#5d2324" stroke-width="5"/>
      <path d="M-13-2l13-17L13-2v24h-26zM0-15v37" fill="none" stroke="#d39b59" stroke-width="4" stroke-linejoin="round"/>
    </g>
    <path d="M-199-122q101-26 199-3 98-23 199 3" fill="none" stroke="#e0bd70" stroke-width="5" stroke-linecap="round"/>
  </g>

  <!-- restrained gold glints -->
  <g fill="#c39c54" opacity=".85">
    <path d="M86 104l5 14 14 5-14 5-5 14-5-14-14-5 14-5z"/>
    <path d="M705 414l4 11 11 4-11 4-4 11-4-11-11-4 11-4z"/>
    <circle cx="716" cy="486" r="5"/>
    <circle cx="93" cy="390" r="4"/>
  </g>
</svg>
