<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<script src="/shared/universal-game.js"></script>
<link rel="stylesheet" href="/shared/universal-game.css">
<meta name="theme-color" content="#7ea84d">
<title>Sheepdog</title>
<style>
  :root {
    color-scheme: dark;
    --ink: #1b2416;
    --cream: #f7f0d8;
    --grass: #799f4c;
    --grass-dark: #5f823c;
    --gold: #f4c95d;
    --danger: #d95f4b;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #26361f; font-family: ui-rounded, "SF Pro Rounded", system-ui, sans-serif; }
  body { touch-action: none; user-select: none; }
  #game { display: block; width: 100vw; height: 100dvh; }
  .hud {
    position: fixed; inset: max(10px, env(safe-area-inset-top)) 12px auto 12px;
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px;
    pointer-events: none; z-index: 2;
  }
  .pill {
    min-width: 0; padding: 8px 10px; border-radius: 14px;
    background: rgba(20,28,16,.72); border: 1px solid rgba(255,255,255,.12);
    box-shadow: 0 5px 18px rgba(0,0,0,.18);
    color: var(--cream); font-weight: 800; text-align: center; line-height: 1.05;
    backdrop-filter: blur(6px);
  }
  .pill small { display:block; opacity:.72; font-size:10px; letter-spacing:.08em; text-transform:uppercase; margin-bottom:3px; }
  .pill strong { font-size:18px; }
  .top-buttons {
    position: fixed; right: 12px; top: calc(max(10px, env(safe-area-inset-top)) + 62px);
    display:flex; gap:8px; z-index:3;
  }
  button {
    appearance:none; border:1px solid rgba(255,255,255,.16);
    background:rgba(20,28,16,.78); color:var(--cream); border-radius:13px;
    width:42px; height:42px; font-size:20px; font-weight:900;
    box-shadow:0 5px 18px rgba(0,0,0,.2);
  }
  #overlay {
    position:fixed; inset:0; z-index:5; display:grid; place-items:center;
    background:linear-gradient(rgba(25,36,20,.48),rgba(16,24,13,.78));
    padding:24px;
  }
  #panel {
    width:min(430px, 100%); padding:26px 22px 22px; border-radius:26px;
    background:rgba(246,239,213,.96); color:var(--ink); text-align:center;
    box-shadow:0 24px 80px rgba(0,0,0,.35); border:2px solid rgba(255,255,255,.7);
  }
  h1 { margin:0 0 6px; font-size:clamp(34px,10vw,58px); letter-spacing:-.05em; }
  #subtitle { margin:0 auto 18px; max-width:320px; font-size:15px; line-height:1.35; opacity:.8; }
  #result { font-weight:900; font-size:20px; margin:0 0 12px; color:#456331; }
  #start {
    width:100%; height:54px; border:0; border-radius:17px; color:#1f281a;
    background:var(--gold); font-size:18px; box-shadow:0 8px 0 #cda23b;
  }
  #start:active { transform:translateY(4px); box-shadow:0 4px 0 #cda23b; }
  .tips { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin:18px 0 4px; font-size:12px; text-align:left; }
  .tip { border-radius:12px; padding:10px; background:rgba(61,89,41,.1); }
  .tip b { display:block; margin-bottom:3px; }
  #joystick {
    position:fixed; left:max(18px, env(safe-area-inset-left)); bottom:max(18px, env(safe-area-inset-bottom));
    width:132px; height:132px; border-radius:50%; z-index:4;
    background:rgba(20,28,16,.24); border:2px solid rgba(255,255,255,.2);
    box-shadow:inset 0 0 30px rgba(0,0,0,.14);
    display:none;
  }
  #stick {
    position:absolute; left:41px; top:41px; width:50px; height:50px; border-radius:50%;
    background:rgba(247,240,216,.82); border:2px solid rgba(255,255,255,.7);
    box-shadow:0 6px 20px rgba(0,0,0,.22);
  }
  #dash {
    position:fixed; right:max(22px, env(safe-area-inset-right)); bottom:max(28px, env(safe-area-inset-bottom));
    width:82px; height:82px; border-radius:50%; z-index:4; display:none;
    background:rgba(244,201,93,.88); color:#28321f; border:3px solid rgba(255,255,255,.5);
    font-size:14px; letter-spacing:.05em; box-shadow:0 8px 22px rgba(0,0,0,.25);
  }
  @media (pointer: coarse), (max-width: 820px) {
    #joystick, #dash { display:block; }
  }
</style>
</head>
<body>
<canvas id="game"></canvas>

<div class="hud">
  <div class="pill"><small>Sheep Penned</small><strong id="saved">0 / 8</strong></div>
  <div class="pill"><small>Time</small><strong id="time">60</strong></div>
  <div class="pill"><small>Score</small><strong id="score">0</strong></div>
</div>
<div class="top-buttons">
  <button id="sound" aria-label="Toggle sound">♪</button>
  <button id="restart" aria-label="Restart">↻</button>
</div>

<div id="joystick"><div id="stick"></div></div>
<button id="dash">BARK</button>

<div id="overlay">
  <div id="panel">
    <h1>Sheepdog</h1>
    <p id="result"></p>
    <p id="subtitle">Herd every sheep into the pen before time runs out. Wolves scatter the flock.</p>
    <div class="tips">
      <div class="tip"><b>Move</b>WASD, arrows, or the touch stick.</div>
      <div class="tip"><b>Bark</b>Space or the button for a strong push.</div>
    </div>
    <button id="start">Start Herding</button>
  </div>
</div>

<script>
(() => {
  'use strict';
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const savedEl = document.getElementById('saved');
  const timeEl = document.getElementById('time');
  const scoreEl = document.getElementById('score');
  const overlay = document.getElementById('overlay');
  const resultEl = document.getElementById('result');
  const startBtn = document.getElementById('start');
  const restartBtn = document.getElementById('restart');
  const soundBtn = document.getElementById('sound');
  const joy = document.getElementById('joystick');
  const stick = document.getElementById('stick');
  const dashBtn = document.getElementById('dash');

  let W = 0, H = 0, DPR = 1, last = 0, running = false, paused = false, frameId = null, status = 'menu', scoreSubmitted = false;
  let score = 0, saved = 0, timeLeft = 60, wolfTimer = 8, barkCooldown = 0;
  let audioOn = true, audioCtx = null;
  let dog, sheep = [], wolves = [], particles = [], keys = {};
  const SHEEP_COUNT = 8;
  const pen = { x: 0, y: 0, w: 150, h: 120 };
  const joyState = { active:false, id:null, x:0, y:0 };

  function resize() {
    DPR = Math.min(2, devicePixelRatio || 1);
    W = innerWidth; H = innerHeight;
    canvas.width = Math.round(W * DPR);
    canvas.height = Math.round(H * DPR);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    pen.w = Math.min(165, W * .31);
    pen.h = Math.min(130, H * .22);
    pen.x = W - pen.w - 22;
    pen.y = H - pen.h - 22;
  }

  function rand(a,b){ return a + Math.random() * (b-a); }
  function clamp(v,a,b){ return Math.max(a,Math.min(b,v)); }
  function dist(a,b){ return Math.hypot(a.x-b.x,a.y-b.y); }

  function reset() {
    score = 0; saved = 0; timeLeft = 60; wolfTimer = 7; barkCooldown = 0; scoreSubmitted = false;
    sheep = []; wolves = []; particles = [];
    dog = { x: W*.24, y:H*.55, r:16, vx:0, vy:0, speed:245, facing:0 };
    for(let i=0;i<SHEEP_COUNT;i++){
      sheep.push({
        x: rand(70, W-190), y: rand(100, H-80), r:13,
        vx:rand(-15,15), vy:rand(-15,15), penned:false, panic:0,
        phase:rand(0,Math.PI*2)
      });
    }
    updateHUD();
  }

  function start() {
    reset();
    overlay.style.display='none';
    running = true;
    paused = false;
    status = 'playing';
    last = performance.now();
    if (frameId === null) frameId = requestAnimationFrame(loop);
    tone(430,.07,'sine',.035);
  }

  function end(win) {
    running = false;
    paused = false;
    status = 'game-over';
    keys = {};
    joyState.active = false; joyState.id = null; joyState.x = joyState.y = 0;
    const best = Math.max(Number(localStorage.sheepdogBest||0), score);
    localStorage.sheepdogBest = best;
    resultEl.textContent = win ? `All sheep safe! Score ${score}` : `Time's up. ${saved} of ${SHEEP_COUNT} safe.`;
    document.getElementById('subtitle').textContent = `Best score: ${best}. Herd tightly, bark carefully, and keep wolves away from the pen.`;
    startBtn.textContent = 'Play Again';
    overlay.style.display='grid';
    if (!scoreSubmitted) {
      scoreSubmitted = true;
      window.EscapeeScores?.submit(Math.max(0, Math.floor(score)), {
        label: 'Herding score',
        display: `${Math.max(0, Math.floor(score)).toLocaleString()} points`
      });
    }
    tone(win?650:170,.25,win?'triangle':'sawtooth',.05);
  }

  function updateHUD(){
    savedEl.textContent = `${saved} / ${SHEEP_COUNT}`;
    timeEl.textContent = Math.ceil(timeLeft);
    scoreEl.textContent = score;
  }

  function tone(freq,dur,type='sine',vol=.03){
    if(!audioOn) return;
    try{
      audioCtx ||= new (window.AudioContext||window.webkitAudioContext)();
      const o=audioCtx.createOscillator(), g=audioCtx.createGain();
      o.type=type; o.frequency.value=freq; g.gain.value=vol;
      o.connect(g); g.connect(audioCtx.destination);
      o.start(); g.gain.exponentialRampToValueAtTime(.0001,audioCtx.currentTime+dur);
      o.stop(audioCtx.currentTime+dur);
    }catch(e){}
  }

  function bark(){
    if(!running || barkCooldown>0) return;
    barkCooldown=1.1;
    tone(125,.12,'square',.045);
    for(let i=0;i<18;i++) particles.push({x:dog.x,y:dog.y,vx:Math.cos(i/18*Math.PI*2)*rand(80,170),vy:Math.sin(i/18*Math.PI*2)*rand(80,170),life:.45});
    sheep.forEach(s=>{
      if(s.penned) return;
      const dx=s.x-dog.x, dy=s.y-dog.y, d=Math.hypot(dx,dy);
      if(d<150){ const p=(1-d/150)*360; s.vx+=dx/(d||1)*p; s.vy+=dy/(d||1)*p; s.panic=1.2; }
    });
    wolves.forEach(w=>{
      const dx=w.x-dog.x,dy=w.y-dog.y,d=Math.hypot(dx,dy);
      if(d<175){ w.vx+=dx/(d||1)*440; w.vy+=dy/(d||1)*440; w.flee=1.6; }
    });
  }

  function spawnWolf(){
    const side=Math.floor(rand(0,4)); let x,y;
    if(side===0){x=-25;y=rand(90,H-60)}
    if(side===1){x=W+25;y=rand(90,H-60)}
    if(side===2){x=rand(0,W);y=-25}
    if(side===3){x=rand(0,W);y=H+25}
    wolves.push({x,y,r:15,vx:0,vy:0,life:10,flee:0});
    tone(85,.18,'sawtooth',.025);
  }

  function update(dt){
    timeLeft -= dt;
    barkCooldown=Math.max(0,barkCooldown-dt);
    if(timeLeft<=0){timeLeft=0;updateHUD();end(saved===SHEEP_COUNT);return;}

    let ix=(keys.ArrowRight||keys.KeyD?1:0)-(keys.ArrowLeft||keys.KeyA?1:0)+joyState.x;
    let iy=(keys.ArrowDown||keys.KeyS?1:0)-(keys.ArrowUp||keys.KeyW?1:0)+joyState.y;
    const il=Math.hypot(ix,iy); if(il>1){ix/=il;iy/=il;}
    dog.vx += (ix*dog.speed-dog.vx)*Math.min(1,dt*12);
    dog.vy += (iy*dog.speed-dog.vy)*Math.min(1,dt*12);
    dog.x=clamp(dog.x+dog.vx*dt,22,W-22); dog.y=clamp(dog.y+dog.vy*dt,78,H-22);
    if(Math.hypot(dog.vx,dog.vy)>10) dog.facing=Math.atan2(dog.vy,dog.vx);

    wolfTimer-=dt;
    if(wolfTimer<=0){ spawnWolf(); wolfTimer=rand(9,13)-Math.min(4,(60-timeLeft)/16); }

    for(const s of sheep){
      if(s.penned) continue;
      s.phase+=dt*2;
      s.panic=Math.max(0,s.panic-dt);
      let ax=Math.cos(s.phase)*6, ay=Math.sin(s.phase*.83)*6;
      let dx=s.x-dog.x,dy=s.y-dog.y,d=Math.hypot(dx,dy);
      if(d<105){const f=(1-d/105)*520;ax+=dx/(d||1)*f;ay+=dy/(d||1)*f;s.panic=.4;}
      for(const w of wolves){
        dx=s.x-w.x;dy=s.y-w.y;d=Math.hypot(dx,dy);
        if(d<150){const f=(1-d/150)*760;ax+=dx/(d||1)*f;ay+=dy/(d||1)*f;s.panic=1;}
      }
      s.vx+=ax*dt; s.vy+=ay*dt;
      const drag=Math.pow(.12,dt); s.vx*=drag; s.vy*=drag;
      const max=s.panic>0?210:95, sp=Math.hypot(s.vx,s.vy);
      if(sp>max){s.vx=s.vx/sp*max;s.vy=s.vy/sp*max;}
      s.x+=s.vx*dt;s.y+=s.vy*dt;
      if(s.x<s.r){s.x=s.r;s.vx=Math.abs(s.vx)*.65}
      if(s.x>W-s.r){s.x=W-s.r;s.vx=-Math.abs(s.vx)*.65}
      if(s.y<78+s.r){s.y=78+s.r;s.vy=Math.abs(s.vy)*.65}
      if(s.y>H-s.r){s.y=H-s.r;s.vy=-Math.abs(s.vy)*.65}

      const inside=s.x>pen.x+8&&s.x<pen.x+pen.w-8&&s.y>pen.y+8&&s.y<pen.y+pen.h-8;
      if(inside){
        s.penned=true;s.vx=s.vy=0;saved++;score+=100+Math.ceil(timeLeft)*2;
        for(let i=0;i<12;i++)particles.push({x:s.x,y:s.y,vx:rand(-80,80),vy:rand(-110,-25),life:rand(.4,.8)});
        tone(520+saved*30,.11,'triangle',.035);
        updateHUD();
        if(saved===SHEEP_COUNT){end(true);return;}
      }
    }

    wolves = wolves.filter(w=>{
      w.life-=dt;w.flee=Math.max(0,w.flee-dt);
      let target=sheep.find(s=>!s.penned), tx=target?target.x:W/2, ty=target?target.y:H/2;
      if(w.flee>0){tx=w.x+(w.x-dog.x)*2;ty=w.y+(w.y-dog.y)*2;}
      const dx=tx-w.x,dy=ty-w.y,d=Math.hypot(dx,dy);
      w.vx+=(dx/(d||1)*130-w.vx)*Math.min(1,dt*3);
      w.vy+=(dy/(d||1)*130-w.vy)*Math.min(1,dt*3);
      const dd=dist(w,dog);
      if(dd<45){w.vx+=(w.x-dog.x)/(dd||1)*250;w.vy+=(w.y-dog.y)/(dd||1)*250;score+=1;}
      w.x+=w.vx*dt;w.y+=w.vy*dt;
      return w.life>0 && w.x>-80&&w.x<W+80&&w.y>-80&&w.y<H+80;
    });

    particles=particles.filter(p=>{p.life-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=.96;p.vy*=.96;return p.life>0});
    score=Math.max(0,Math.floor(score));
    updateHUD();
  }

  function roundRect(x,y,w,h,r){
    ctx.beginPath();ctx.roundRect(x,y,w,h,r);
  }

  function draw(){
    const g=ctx.createLinearGradient(0,0,0,H);
    g.addColorStop(0,'#8aad57');g.addColorStop(1,'#648842');
    ctx.fillStyle=g;ctx.fillRect(0,0,W,H);

    ctx.globalAlpha=.13;ctx.strokeStyle='#e9f3c9';ctx.lineWidth=1;
    for(let x=12;x<W;x+=28){ctx.beginPath();ctx.moveTo(x,76);ctx.lineTo(x-6,H);ctx.stroke();}
    ctx.globalAlpha=1;

    // Pen
    ctx.fillStyle='rgba(219,190,125,.18)';roundRect(pen.x,pen.y,pen.w,pen.h,15);ctx.fill();
    ctx.strokeStyle='#d2a85a';ctx.lineWidth=8;ctx.setLineDash([22,10]);roundRect(pen.x,pen.y,pen.w,pen.h,12);ctx.stroke();ctx.setLineDash([]);
    ctx.fillStyle='rgba(31,42,24,.78)';ctx.font='800 12px system-ui';ctx.textAlign='center';
    ctx.fillText('PEN',pen.x+pen.w/2,pen.y-12);

    // Wolves
    for(const w of wolves){
      ctx.save();ctx.translate(w.x,w.y);ctx.rotate(Math.atan2(w.vy,w.vx));
      ctx.fillStyle='#3b4140';ctx.beginPath();ctx.ellipse(0,0,19,11,0,0,Math.PI*2);ctx.fill();
      ctx.beginPath();ctx.moveTo(11,-8);ctx.lineTo(18,-17);ctx.lineTo(20,-5);ctx.fill();
      ctx.beginPath();ctx.moveTo(11,8);ctx.lineTo(18,17);ctx.lineTo(20,5);ctx.fill();
      ctx.fillStyle='#e7d664';ctx.beginPath();ctx.arc(12,-3,2,0,7);ctx.arc(12,3,2,0,7);ctx.fill();
      ctx.restore();
    }

    // Sheep
    for(const s of sheep){
      ctx.save();ctx.translate(s.x,s.y);
      if(s.penned) ctx.globalAlpha=.75;
      ctx.fillStyle='#f7f0d8';
      for(const [x,y,r] of [[0,0,13],[-9,-2,8],[8,-5,8],[-4,8,8],[10,7,7]]){ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.fill();}
      ctx.fillStyle='#34372d';ctx.beginPath();ctx.ellipse(13,1,7,6,0,0,7);ctx.fill();
      ctx.fillStyle='#eee';ctx.beginPath();ctx.arc(15,-1,1.4,0,7);ctx.fill();
      ctx.restore();
    }

    // Dog
    ctx.save();ctx.translate(dog.x,dog.y);ctx.rotate(dog.facing);
    ctx.fillStyle='#6f3f22';ctx.beginPath();ctx.ellipse(0,0,19,12,0,0,7);ctx.fill();
    ctx.fillStyle='#f2ede0';ctx.beginPath();ctx.ellipse(5,0,9,10,0,0,7);ctx.fill();
    ctx.fillStyle='#4b2818';ctx.beginPath();ctx.moveTo(10,-7);ctx.lineTo(17,-15);ctx.lineTo(18,-4);ctx.fill();
    ctx.beginPath();ctx.moveTo(10,7);ctx.lineTo(17,15);ctx.lineTo(18,4);ctx.fill();
    ctx.fillStyle='#171b14';ctx.beginPath();ctx.arc(18,0,3,0,7);ctx.fill();
    ctx.strokeStyle='#6f3f22';ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(-16,0);ctx.quadraticCurveTo(-28,-10,-25,-20);ctx.stroke();
    ctx.restore();

    for(const p of particles){
      ctx.globalAlpha=clamp(p.life*2,0,1);ctx.fillStyle='#fff2b2';ctx.beginPath();ctx.arc(p.x,p.y,3,0,7);ctx.fill();
    }
    ctx.globalAlpha=1;

    if(barkCooldown>0){
      ctx.fillStyle='rgba(25,34,20,.42)';roundRect(14,H-16,130,6,3);ctx.fill();
      ctx.fillStyle='#f4c95d';roundRect(14,H-16,130*(1-barkCooldown/1.1),6,3);ctx.fill();
    }
  }

  function loop(t){
    if(!running){ frameId = null; return; }
    const dt=Math.min(.033,(t-last)/1000||0);last=t;
    if (!paused) update(dt);
    draw();
    frameId = requestAnimationFrame(loop);
  }

  function clearInput() {
    keys = {};
    joyState.active = false; joyState.id = null; joyState.x = joyState.y = 0;
    stick.style.transform = 'translate(0,0)';
  }

  addEventListener('blur', clearInput);
  addEventListener('pagehide', clearInput);
  document.addEventListener('visibilitychange', () => { if (document.hidden) clearInput(); });
  addEventListener('escapee:pause', clearInput);

  addEventListener('resize',resize);
  addEventListener('keydown',e=>{keys[e.code]=true;if(e.code==='Space'){e.preventDefault();bark();}});
  addEventListener('keyup',e=>keys[e.code]=false);

  function joyPoint(e){
    const r=joy.getBoundingClientRect(), cx=r.left+r.width/2, cy=r.top+r.height/2;
    let dx=e.clientX-cx,dy=e.clientY-cy,d=Math.hypot(dx,dy),m=42;
    if(d>m){dx=dx/d*m;dy=dy/d*m;}
    joyState.x=dx/m;joyState.y=dy/m;
    stick.style.transform=`translate(${dx}px,${dy}px)`;
  }
  joy.addEventListener('pointerdown',e=>{joyState.active=true;joyState.id=e.pointerId;joy.setPointerCapture(e.pointerId);joyPoint(e);});
  joy.addEventListener('pointermove',e=>{if(joyState.active&&e.pointerId===joyState.id)joyPoint(e);});
  function endJoy(e){if(e.pointerId!==joyState.id)return;joyState.active=false;joyState.id=null;joyState.x=joyState.y=0;stick.style.transform='translate(0,0)';}
  joy.addEventListener('pointerup',endJoy);joy.addEventListener('pointercancel',endJoy);
  dashBtn.addEventListener('pointerdown',e=>{e.preventDefault();bark();});
  startBtn.addEventListener('click',start);
  restartBtn.addEventListener('click',start);
  soundBtn.addEventListener('click',()=>{audioOn=!audioOn;soundBtn.textContent=audioOn?'♪':'×';if(audioOn)tone(440,.05);});

  window.EscapeeGame = {
    restart: start,
    pause() {
      if (status === 'playing') {
        paused = true;
        status = 'paused';
        clearInput();
      }
    },
    resume() {
      if (status === 'paused') {
        paused = false;
        status = 'playing';
        last = performance.now();
      }
    },
    setMuted(value) {
      audioOn = !Boolean(value);
      soundBtn.textContent = audioOn ? '♪' : '×';
      if (audioOn) {
        try { tone(440, .05); } catch {}
      }
    },
    getStatus() { return status; }
  };

  resize();reset();draw();
})();
</script>
</body>
</html>
