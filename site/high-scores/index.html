<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#173568">
  <meta name="description" content="Top ten scores for every scored Escapee Games title.">
  <link rel="icon" href="/assets/favicon.svg">
  <link rel="stylesheet" href="/site.css">
  <link rel="stylesheet" href="./high-scores.css">
  <script src="./high-scores.js" defer></script>
  <title>Arcade High Scores | Escapee Games</title>
</head>
<body>
  <header class="masthead">
    <div class="masthead__inner">
      <a class="brand" href="/" aria-label="Escapee Games home"><span class="brand__badge">EG</span><span><strong>Escapee Games</strong><small>Tiny games. Quick escapes.</small></span></a>
      <nav class="arcade-nav" aria-label="Arcade navigation"><a href="/">All Games</a></nav>
    </div>
  </header>
  <main class="scores-page">
    <section class="scores-hero">
      <p class="kicker">Permanent arcade records</p>
      <h1>Arcade High Scores</h1>
      <p>The ten highest signed scores for every scored game. Submitted records cannot be edited.</p>
    </section>
    <p class="scores-status" id="scores-status" role="status">Loading high scores...</p>
    <section class="score-grid" id="score-grid" aria-label="Game leaderboards"></section>
  </main>
  <footer><p>Scores are stored in the arcade database.</p><a href="/">Back to games</a></footer>
</body>
</html>
